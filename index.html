<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower Market</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="./style.css" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font noto Serif -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Google Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Favicon -->
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon" />
  </head>
  <!-- Body -->
  <body class="bg-[#f5f8ff]">
    <header
      class="max-w-[1140px] inter-font mt-10 lg:mb-40 sm:mb-20 lg:mx-auto sm:mx-10 md:mx-10"
    >
      <nav class="flex w-full justify-between">
        <div class="flex items-center">
          <img src="./assets/logo.png" alt="Brand Logo" />
        </div>

        <div class="flex gap-7 items-center text-2xl">
          <div class="hidden md:block space-x-7 mr-3">
            <a class="font-bold text-[#252432]" href="./index.html">Home</a>
            <a class="text-[#8987A1]" href="./index.html">Shop</a>
            <a class="text-[#8987A1]" href="./index.html">Abouut Us</a>
          </div>
          <div class="flex items-center">
            <a href="./index.html"
              ><i class="fa-solid fa-cart-shopping"></i> Cart ($65)</a
            >
          </div>
        </div>
      </nav>
    </header>

    <main class="max-w-[1140px] my-10 lg:mx-auto sm:mx-10 md:mx-10">
      <!-- Banner -->
      <section
        id="Hero-Banner-container"
        class="flex lg:flex-row sm:flex-col-reverse lg:items-end sm:items-start"
      >
        <div class="lg:w-1/2 sm:h-full">
          <h1 class="text-6xl noto-serif-font mb-5 leading-20">
            <span class="font-bold">
              ALWAYS <span class="text-[#e95a08]">FRESH</span> <br />
              <span class="text-[#e85a08]">FLOWERS</span></span
            >
          </h1>
          <p class="text-[#7b7c80] inter-font text-2xl">
            Indulge your senses with the beauty and fragrance of our fresh
            flower shop. From classic roses to exotic <br />blooms, we offer a
            wide variety of fresh flowers that <br />
            are perfect for any occasion.
          </p>
        </div>
        <div class="lg:w-1/2 sm:h-full">
          <img
            class="lg:w-full sm:h-full sm:mb-8"
            src="./assets/hero-flower.png"
            alt=""
          />
        </div>
      </section>
    </main>
  </body>
</html>
